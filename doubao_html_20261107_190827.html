<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>魔法占卜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{
  overflow:hidden;
  background:#050510;
  color:#fff;
  height:100vh;
}
#formWrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#1b1b40,#050510);
  z-index:10;
  transition: opacity 1.2s ease;
}
.form-card{
  width:90%;max-width:420px;padding:32px;border-radius:18px;
  background:rgba(25,20,50,0.85);
  border:1px solid #7c57d8;
  box-shadow:0 0 30px #7c57d844;
}
.form-card h2{text-align:center;margin-bottom:24px;color:#e2cfff}
.form-item{margin-bottom:18px}
.form-item label{display:block;margin-bottom:6px;color:#d3c1ff}
.form-row{display:flex;gap:8px}
.form-row select{flex:1}
.form-item input,.form-item select{
  width:100%;padding:11px;border-radius:10px;border:1px solid #6444b4;
  background:#14102b;color:#fff;font-size:16px;outline:none
}
#submitBtn{
  width:100%;padding:13px;border-radius:10px;border:none;
  background:linear-gradient(90deg,#7c42d8,#4275d8);
  color:white;font-size:17px;cursor:pointer;transition:0.3s
}
#submitBtn:hover{filter:brightness(1.15)}

/* 粒子画布遮罩 */
#particleCanvas{
  position:fixed;
  inset:0;
  background:#050510;
  z-index:20;
  opacity:0;
  pointer-events:none;
}
#resultBox{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  line-height:2.4;
  color:#e9d8ff;
  text-align:center;
  padding:20px;
  opacity:0;
  transition: opacity 1.2s ease;
}
.hidden{
  pointer-events:none;
}
</style>
</head>
<body>
<div id="formWrap">
  <div class="form-card">
    <h2>✨ 魔法占卜</h2>
    <div class="form-item">
      <label>姓名</label>
      <input type="text" id="name" placeholder="输入你的姓名" required>
    </div>
    <div class="form-item">
      <label>出生日期</label>
      <div class="form-row">
        <select id="yearSel"></select>
        <select id="monthSel">
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
        <select id="daySel"></select>
      </div>
    </div>
    <div class="form-item">
      <label>性别</label>
      <select id="gender">
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <button id="submitBtn">开启占卜</button>
  </div>
</div>

<canvas id="particleCanvas"></canvas>
<div id="resultBox"></div>

<script>
// 年份 1990 ~ 2080
const yearSel = document.getElementById('yearSel');
for(let y = 1990; y <= 2080; y++){
  const opt = document.createElement('option');
  opt.value = y;
  opt.innerText = y;
  yearSel.appendChild(opt);
}
// 联动日期
function fillDay(){
  const mon = Number(document.getElementById('monthSel').value);
  const y = Number(yearSel.value);
  const maxDay = new Date(y, mon, 0).getDate();
  const daySel = document.getElementById('daySel');
  daySel.innerHTML = '';
  for(let d=1;d<=maxDay;d++){
    const o = document.createElement('option');
    o.value=d;o.innerText=d;
    daySel.appendChild(o);
  }
}
document.getElementById('monthSel').onchange = fillDay;
yearSel.onchange = fillDay;
fillDay();

// 计算周岁
function calcAge(y,m,d){
  const birth = new Date(y,m-1,d);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const pass = (now.getMonth() > birth.getMonth()) || (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if(!pass) age--;
  return age;
}

// 粒子系统
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;
let maskActive = false;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle{
  constructor(){
    this.x = canvas.width / 2;
    this.y = canvas.height / 2;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.radius = 2 + Math.random() * 3;
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= 0.008;
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    ctx.fillStyle = `rgba(180,140,255,${this.alpha})`;
    ctx.fill();
  }
}
function startParticleMask(){
  particles = [];
  maskActive = true;
  canvas.style.opacity = '1';
  canvas.style.pointerEvents = 'auto';
  for(let i=0;i<600;i++){
    particles.push(new Particle());
  }
  loop();
}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.update();
    p.draw();
    if(p.alpha <= 0){
      particles.splice(i,1);
    }
  }
  if(particles.length > 0){
    animId = requestAnimationFrame(loop);
  }else{
    maskActive = false;
    canvas.style.opacity = '0';
    document.getElementById('resultBox').style.opacity = '1';
  }
}

// 提交
document.getElementById('submitBtn').onclick = ()=>{
  const name = document.getElementById('name').value.trim();
  const y = Number(yearSel.value);
  const m = Number(document.getElementById('monthSel').value);
  const d = Number(document.getElementById('daySel').value);
  const gender = document.getElementById('gender').value;
  if(!name){alert("请填写姓名");return;}
  const age = calcAge(y,m,d);
  document.getElementById('resultBox').innerHTML = `
姓名：${name}<br>
出生日期：${y}年${m}月${d}日<br>
年龄：${age} 岁<br>
性别：${gender}
  `;
  const formWrap = document.getElementById('formWrap');
  formWrap.style.opacity = '0';
  setTimeout(()=>formWrap.classList.add('hidden'),1200);
  startParticleMask();
}
</script>
</body>
</html>

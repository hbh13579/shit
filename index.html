<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>魔法占卜书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{overflow:hidden;background:#050510;color:#fff}
#formWrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#1b1b40,#050510);
  z-index:10;transition:opacity 1.2s ease;
}
.form-card{
  width:90%;max-width:420px;padding:32px;border-radius:18px;
  background:rgba(25,20,50,0.85);
  border:1px solid #7c57d8;box-shadow:0 0 30px #7c57d844;
}
.form-card h2{text-align:center;margin-bottom:24px;color:#e2cfff}
.form-item{margin-bottom:18px}
.form-item label{display:block;margin-bottom:6px;color:#d3c1ff}
.form-row{display:flex;gap:8px}
.form-row select{flex:1}
.form-item input,.form-item select{
  width:100%;padding:11px;border-radius:10px;border:1px solid #6444b4;
  background:#14102b;color:#fff;font-size:16px;outline:none
}
#submitBtn{
  width:100%;padding:13px;border-radius:10px;border:none;
  background:linear-gradient(90deg,#7c42d8,#4275d8);
  color:white;font-size:17px;cursor:pointer;transition:0.3s
}
#submitBtn:hover{filter:brightness(1.15)}

#resultStage{
  position:absolute;inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#050510;
  z-index:5;
}

#particleCanvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  z-index:1;
}

#infoText{
  position:relative;
  color:#ffeebb;
  font-size:22px;
  line-height:2.2;
  text-align:center;
  z-index:2;
  opacity:0;
  transform:translateY(20px);
  transition:opacity 1.2s ease, transform 1.2s ease;
  text-shadow:0 0 12px #7c57d8;
  pointer-events:none;
}
#infoText.show{
  opacity:1;
  transform:translateY(0);
}
.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>

<div id="formWrap">
  <div class="form-card">
    <h2>✨ 魔法占卜书</h2>

    <div class="form-item">
      <label>姓名</label>
      <input type="text" id="name" placeholder="输入你的姓名" />
    </div>

    <div class="form-item">
      <label>出生日期</label>
      <div class="form-row">
        <select id="yearSel"></select>
        <select id="monthSel">
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
          <option value="13">13月</option>
        </select>
        <select id="daySel"></select>
      </div>
    </div>

    <div class="form-item">
      <label>性别</label>
      <select id="gender">
        <option value="">请选择</option>
        <option value="男">男</option>
        <option value="女">女</option>
        <option value="跨性别男">跨性别男</option>
        <option value="跨性别女">跨性别女</option>
        <option value="非二元性别">非二元性别</option>
        <option value="酷儿">酷儿</option>
        <option value="无性别">无性别</option>
        <option value="流动性别">流动性别</option>
        <option value="双灵">双灵</option>
        <option value="不愿透露">不愿透露</option>
        <option value="沃尔玛购物袋">沃尔玛购物袋</option>
        <option value="武装直升机">武装直升机</option>
      </select>
    </div>

    <button id="submitBtn">开始占卜</button>
  </div>
</div>

<div id="resultStage">
  <canvas id="particleCanvas"></canvas>
  <div id="infoText"></div>
</div>

<script>
// 生成年份：1990 ~ 2080
const yearSel = document.getElementById('yearSel');
for(let y = 1990; y <= 2080; y++){
  const opt = document.createElement('option');
  opt.value = y;
  opt.innerText = y;
  yearSel.appendChild(opt);
}

// 日期固定 1-32 日
const daySel = document.getElementById('daySel');
for(let d = 1; d <= 32; d++){
  const o = document.createElement('option');
  o.value = d;
  o.innerText = d;
  daySel.appendChild(o);
}

// 魔法非法日期判断
function isMagicInvalidDate(y, m, d){
  if(m === 13) return true;
  const realMaxDay = new Date(y, m, 0).getDate();
  if(d > realMaxDay) return true;
  return false;
}

// 计算周岁
function calcAge(y, m, d){
  if(isMagicInvalidDate(y, m, d)) return 0;
  const birth = new Date(y, m - 1, d);
  const now = new Date();
  let age = now.getFullYear() - birth.getFullYear();
  const pass = (now.getMonth() > birth.getMonth()) ||
               (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if(!pass) age--;
  return age;
}

// 紫色粒子散开效果
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let particleAnimId = null;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createParticles(){
  particles = [];
  const count = 180;
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      color: Math.random() < 0.5 ? '#b57cff' : '#7c57d8',
      size: 1 + Math.random() * 2
    });
  }
}

function animateParticles(){
  ctx.fillStyle = 'rgba(5, 5, 16, 0.18)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for(let i = 0; i < particles.length; i++){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.008;

    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  particles = particles.filter(p => p.life > 0);

  if(particles.length > 0){
    particleAnimId = requestAnimationFrame(animateParticles);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showText();
  }
}

function showText(){
  const infoText = document.getElementById('infoText');
  setTimeout(() => {
    infoText.classList.add('show');
  }, 200);
}

// 提交
document.getElementById('submitBtn').addEventListener('click', ()=>{
  const name = document.getElementById('name').value.trim();
  const gender = document.getElementById('gender').value;
  const y = Number(yearSel.value);
  const m = Number(document.getElementById('monthSel').value);
  const d = Number(document.getElementById('daySel').value);

  if(!name){
    alert("请填写姓名");
    return;
  }
  if(!gender){
    alert("请选择性别");
    return;
  }

  const age = calcAge(y, m, d);

  document.getElementById('infoText').innerHTML = `
    姓名：${name}<br>
    出生日期：${y}年${m}月${d}日<br>
    年龄：${age} 岁<br>
    性别：${gender}
  `;

  const formWrap = document.getElementById('formWrap');
  formWrap.style.opacity = '0';

  setTimeout(()=>{
    formWrap.classList.add('hidden');
    document.getElementById('resultStage').style.display = 'flex';
    createParticles();
    animateParticles();
  }, 1200);
});
</script>

</body>
</html>
